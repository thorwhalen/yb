[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yb"
version = "0.1.6"
description = "Streamlining media publishing: prepare, upload, and edit videos (YouTube) and podcasts"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["youtube", "podcast", "publishing", "subtitles", "chapters", "yt-dlp"]
authors = [{ name = "Thor Whalen" }]
# Core: the media engine (transcription, chapters, thumbnails, dubbing).
# Everything platform- or transport-specific is an optional extra below.
dependencies = ["mixing"]

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/yb"
Repository = "https://github.com/thorwhalen/yb"
Documentation = "https://thorwhalen.github.io/yb"

[project.optional-dependencies]
# `yb.youtube` — upload/edit via the official YouTube Data API v3.
youtube = ["google-api-python-client", "google-auth-oauthlib", "google-auth"]
# `yb.music` / `yb.podcast.cover` — audio→video rendering (needs ffmpeg on PATH).
music = ["muvid"]
# `yb.download` — fetch videos/metadata from YouTube (and other sites).
download = ["yt-dlp"]
# `yb.podcast` — ID3 chapter frames + RSS episode feeds.
podcast = ["mutagen", "feedgen"]
# LLM-backed metadata/chapter copywriting (title/description/keywords).
llm = ["aix"]
all = [
    "google-api-python-client", "google-auth-oauthlib", "google-auth",
    "muvid", "yt-dlp", "mutagen", "feedgen", "aix",
]
dev = ["muvid", "pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]
docs = ["sphinx>=6.0", "sphinx-rtd-theme>=1.0"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"**/examples/*" = ["D"]
"**/scrap/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

# ffmpeg is a hard system requirement for yb's media work (yb.render, yb.podcast).
# Declaring it here makes CI install it, so the render tests actually run rather
# than silently skipping.
[tool.wads.ops.ffmpeg]
description = "Multimedia framework for video/audio processing"
url = "https://ffmpeg.org/"
check.linux = "which ffmpeg"
check.macos = "which ffmpeg"
check.windows = "which ffmpeg"
install.linux = ["sudo apt-get update", "sudo apt-get install -y ffmpeg"]
install.macos = "brew install ffmpeg"
install.windows = "choco install ffmpeg -y --no-progress"

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = ["3.10", "3.12"]
pytest_args = ["-v", "--tb=short"]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = ["term", "xml"]
exclude_paths = ["examples", "scrap"]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = ["tests/", "scrap/", "examples/"]
